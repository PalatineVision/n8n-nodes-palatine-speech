name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SCANNER_VERSION: '0.38.0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        run: |
          node scripts/check-release.mjs
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # npm >= 11.5.1 supports trusted publishing; the existing NPM_TOKEN is available as fallback.
      - name: Check trusted publishing support
        run: node -e "const [major,minor,patch]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('Trusted publishing requires npm >= 11.5.1')"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Scan source and packed package before publishing
        run: bash scripts/scan-package.sh

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public

      - name: Verify published version
        env:
          SCANNER_DIR: .ci-tools/n8n-scanner/node_modules/@n8n/scan-community-package
        run: node scripts/verify-published.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            .ci-artifacts/*.tgz
            scan.log
          if-no-files-found: ignore
