# GitLab is the source of truth. GitHub Actions publishes with npm provenance.
# Setup and credentials: docs/ci-cd.md
default:
  tags: [d1]
  before_script:
    - source scripts/ci-node.sh
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .ci-tools/node-v24.11.1-linux-x64/]

variables:
  GIT_DEPTH: '0'
  GITHUB_REPOSITORY: PalatineVision/n8n-nodes-palatine-speech
  SCANNER_VERSION: '0.38.0'
  npm_config_cache: $CI_PROJECT_DIR/.npm

stages: [check, scan, mirror, verify]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"

lint-build-test:
  stage: check
  script:
    - node scripts/check-release.mjs
    - npm ci
    - npm run lint
    - npm run build
    - npm test
  artifacts:
    paths: [dist/]
    expire_in: 7 days

n8n-scan:
  stage: scan
  needs: [lint-build-test]
  script:
    - bash scripts/scan-package.sh
  artifacts:
    paths: [.ci-artifacts/*.tgz]
    expire_in: 7 days

.mirror:
  stage: mirror
  needs: [n8n-scan]
  cache: []
  interruptible: false
  resource_group: github-mirror
  environment:
    name: github-mirror
    action: prepare

mirror-main:
  extends: .mirror
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - bash scripts/mirror-github.sh main

release-to-github:
  extends: .mirror
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: false
  script:
    - bash scripts/mirror-github.sh tag

# Wait for the GitHub release, then check the exact version, source commit and provenance.
verify-published:
  stage: verify
  needs: [release-to-github]
  cache: []
  interruptible: false
  timeout: 20 minutes
  rules:
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - npm install --prefix .ci-tools/n8n-scanner --no-audit --no-fund "@n8n/scan-community-package@$SCANNER_VERSION"
    - SCANNER_DIR=.ci-tools/n8n-scanner/node_modules/@n8n/scan-community-package node scripts/verify-published.mjs
  artifacts:
    when: always
    paths: [scan.log]
    expire_in: 30 days
